aid: pvx-partners
name: Pvx Partners
description: >-
  PvX Partners (PvX Partners Pte Ltd) is a Singapore-based fintech platform that
  provides non-dilutive, performance-based user-acquisition (UA) financing for
  mobile gaming and consumer app studios. Its PvX Capital product offers a
  flexible credit line covering up to 80% of monthly marketing spend with no
  equity dilution, term sheets within 24 hours, and funds within 30 days,
  secured by and repaid from funded user cohorts. PvX Lambda is a cohort
  intelligence engine offering cohort-based ROAS projections, benchmarking, and
  funding-eligibility analysis across 650+ apps and 14,500+ cohorts, and PvX
  Delta rounds out the analytics suite. The firm reports $1B+ in capital
  committed across 100+ client companies. Surfaced as a portfolio company of
  General Catalyst and profiled in the API Evangelist network; it publishes no
  public developer API at this time.
